name: build
on:
  push:
    branches: [main]
    paths-ignore: ["tests/**", ".github/workflows/e2e.yml", "README.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path pulse_connect.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "PULSE_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile (real Windows program, no self-unpacking)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip nuitka ordered-set zstandard *> build.log
          python make_generic.py dashboard_template.html pulse_template.html *>> build.log
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest `
            --windows-console-mode=disable --windows-icon-from-ico=pulse.ico `
            --company-name="Maple Peak" --product-name="Pulse Connect" `
            --file-version=$env:PULSE_VERSION --product-version=$env:PULSE_VERSION `
            --file-description="Pulse Connect - links Tally to Business Pulse" `
            --copyright="Maple Peak" `
            --include-data-files=ui.html=ui.html --include-data-files=pulse_template.html=pulse_template.html `
            --output-filename=PulseConnect.exe --output-dir=dist pulse_connect.py *>> build.log
          $code = $LASTEXITCODE
          if ($code -ne 0 -or -not (Test-Path dist\pulse_connect.dist\PulseConnect.exe)) {
            $tail = (Get-Content build.log -Tail 40) -join '%0A'
            Write-Output "::error title=Compile failed::$tail"
            exit 1
          }
      - name: Self-test (compiled app starts and serves its UI)
        shell: pwsh
        run: |
          $env:PULSE_HOME = "$env:RUNNER_TEMP\pulsehome"
          $p = Start-Process -FilePath dist\pulse_connect.dist\PulseConnect.exe -ArgumentList "--background","--no-browser" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:47819/api/state
          Write-Output $r.Content
          if ($r.Content -notmatch '"step"') { exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:PULSE_HOME\log.txt"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-FileHash out\PulseConnectSetup.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii out\PulseConnectSetup.sha256
      - name: Installer self-test (silent install, app runs, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process out\PulseConnectSetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          $p.WaitForExit()
          $exe = "$env:LOCALAPPDATA\Programs\PulseConnect\PulseConnect.exe"
          if (-not (Test-Path $exe)) { Write-Error "not installed"; exit 1 }
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:47819/hello
          Write-Output $r.Content
          if ($r.Content -notmatch 'pulse-connect') { exit 1 }
          $u = Start-Process "$env:LOCALAPPDATA\Programs\PulseConnect\unins000.exe" -ArgumentList "/VERYSILENT" -PassThru
          $u.WaitForExit(); Start-Sleep -Seconds 5
          if (Test-Path $exe) { Write-Output "::warning::uninstall left the program in place" }
      - uses: actions/upload-artifact@v4
        with:
          name: PulseConnectSetup
          path: out/PulseConnectSetup.*
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (Get-Content out\PulseConnectSetup.sha256).Trim()
          $tag = "v$env:PULSE_VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag out\PulseConnectSetup.exe --title "Pulse Connect $env:PULSE_VERSION" --notes "setup sha256: $sha" --latest
          } else {
            Write-Output "Release $tag already published - not replacing it (installed apps check its checksum). Bump VERSION to publish."
          }
